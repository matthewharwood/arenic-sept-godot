<style>
*{box-sizing:border-box}body{margin:32px auto;padding:24px;max-width:1200px;background:oklch(.15 .018 150);color:oklch(.93 .016 110);font:16px/1.5 system-ui}a{color:inherit;text-underline-offset:4px}nav{display:flex;flex-wrap:wrap;gap:24px;margin-bottom:32px}nav a[aria-current]{font-weight:700}h1{font-size:clamp(40px,7vw,72px);line-height:1.05;margin:12px 0 20px}h2{font-size:24px}.eyebrow,.line-number{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:oklch(.78 .095 135)}.intro{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:start}.portrait-stage{margin:0;border:1px solid oklch(.4 .03 150);background:radial-gradient(ellipse at 50% 35%,oklch(.29 .035 150),oklch(.17 .018 150));padding:16px 16px 0}.portrait{display:block;width:100%;max-height:660px;object-fit:contain}.portrait-stage figcaption{padding:0 0 12px}.reference-portrait{display:block;width:100%;max-height:660px;object-fit:contain;background:oklch(1 0 0);margin-top:18px}.description{font-size:21px;color:oklch(.82 .02 150)}.study{border-top:1px solid oklch(.4 .03 150);margin-top:28px;padding-top:20px}.controls{display:flex;flex-wrap:wrap;gap:12px;margin:16px 0}label{display:flex;gap:8px;align-items:center}button,select{font:inherit;color:inherit;background:oklch(.24 .025 150);border:1px solid oklch(.45 .03 150);padding:7px 12px}button{cursor:pointer}.sprites{display:flex;align-items:end;gap:28px;min-height:160px}.sprites figure{margin:0}canvas{display:block;image-rendering:pixelated;background:oklch(.23 .018 150)}#sprite{width:152px;height:152px}#native{width:19px;height:19px}figcaption,.meta{font-size:13px;color:oklch(.73 .025 150);margin-top:8px}.dialogue{list-style:none;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 36px}.dialogue li{border-top:1px solid oklch(.4 .03 150);padding:18px 0}.dialogue p{font-size:21px;margin:8px 0}details{border-top:1px solid oklch(.4 .03 150);margin-top:28px;padding-top:18px}summary{cursor:pointer;font-weight:700}li{margin-bottom:10px}#load-error{color:oklch(.76 .15 28)}:focus-visible{outline:3px solid oklch(.8 .12 150);outline-offset:4px}@media(max-width:700px){body{margin:0;padding:20px}.intro,.dialogue{grid-template-columns:1fr}.intro{gap:24px}.portrait{max-height:480px}}

<main><section class="intro"><div><figure class="portrait-stage"><img id="portrait" class="portrait" src="dialogue-portrait.png" alt="__NAME__ transparent half-body dialogue portrait"><figcaption>Dialogue portrait · transparent illustration</figcaption></figure><details id="original-reference"><summary>Original full-body reference</summary><img class="reference-portrait" src="portrait.png" alt="__NAME__ original full-body costume and silhouette reference"></details></div><div><p class="eyebrow">NPC / __ROLE__</p><h1>__NAME__</h1><p class="description">__DESCRIPTION__</p><ul>__APPEARANCE__</ul><section class="study" aria-labelledby="study-title"><h2 id="study-title">A quiet presence.</h2><div class="sprites"><figure><canvas id="sprite" width="19" height="19" aria-label="Enlarged animated Keeper sprite"></canvas><figcaption>8× nearest-pixel study</figcaption></figure><figure><canvas id="native" width="19" height="19" aria-label="Native size Keeper sprite"></canvas><figcaption>19 × 19 · 1×</figcaption></figure></div><div class="controls"><label>Motion <select id="state"></select></label><label>Facing <select id="direction"><option value="n">North</option><option value="e">East</option><option value="s">South</option><option value="w">West</option></select></label><button id="replay" type="button">Replay</button></div><p class="meta" id="timing"></p><p id="load-error" role="alert"></p></section></div></section>
<section class="study" aria-labelledby="dialogue-title"><p class="eyebrow">Opening encounter</p><h2 id="dialogue-title">Leave an echo behind.</h2><p class="meta">__PACING__</p><ol class="dialogue">__DIALOGUE__</ol></section>
<details id="design-spoilers"><summary>Design spoilers · future identity</summary><ul>__SPOILERS__</ul></details></main>
<script>const PAGE=__PAGE_DATA__;</script><script>
'use strict';
const state=document.getElementById('state'),direction=document.getElementById('direction');
for(const item of PAGE.npc.visual_states){const option=document.createElement('option');option.value=item.id;option.textContent=item.name;state.append(option)}
const image=new Image(),contexts=['sprite','native'].map(id=>document.getElementById(id).getContext('2d'));let started=performance.now();
function restart(){started=performance.now()}
state.addEventListener('change',restart);direction.addEventListener('change',restart);document.getElementById('replay').addEventListener('click',restart);
function paint(now){const tag=PAGE.sprite.tags.find(item=>item.name===state.value+'_'+direction.value);const frames=PAGE.sprite.frames.slice(tag.from,tag.to+1);const duration=frames.reduce((total,frame)=>total+frame.duration,0);const loop=PAGE.npc.visual_states.find(item=>item.id===state.value).loop;let elapsed=loop?(now-started)%duration:Math.min(now-started,duration-1);let chosen=frames.at(-1);for(const frame of frames){if(elapsed<frame.duration){chosen=frame;break}elapsed-=frame.duration}const r=chosen.frame;for(const context of contexts){context.imageSmoothingEnabled=false;context.clearRect(0,0,19,19);context.drawImage(image,r.x,r.y,r.w,r.h,0,0,19,19)}document.getElementById('timing').textContent=frames.length+' frames · '+(duration/1000).toFixed(2)+'s · '+(loop?'loop':'one shot');requestAnimationFrame(paint)}
image.onload=()=>{restart();requestAnimationFrame(paint)};image.onerror=()=>{document.getElementById('load-error').textContent='The saved NPC sprite could not be loaded.'};image.src=PAGE.sprite.image;
</script></body></html>
